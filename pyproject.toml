[project]
name = "dsa-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    # --- Core ML / embeddings ---
    # torch is needed as the backend for sentence-transformers and
    # transformers, and for the custom pure-PyTorch RGCN model. Only torch
    # itself -- torchvision (computer vision) and torchaudio (audio) are
    # NOT used anywhere in this codebase (confirmed: zero image or audio
    # processing exists in the whole pipeline). torchaudio has also been
    # in official maintenance mode since PyTorch 2.8, with features
    # removed in 2.9 -- not worth pinning even if it were used.
    "transformers>=4.57.0",
    "accelerate>=1.14.0",
    # --- Data ---
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "networkx>=3.6.1",
    "tree-sitter>=0.26.0",
    "xxhash>=3.8.1",
    # --- Databases ---
    "qdrant-client>=1.18.0",
    "neo4j>=6.0.0",
    "psycopg2-binary>=2.9.0",
    # --- API ---
    "fastapi>=0.137.2",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "requests>=2.34.2",
    # --- Config / utility ---
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.0",
    "torch==2.11.0",
    "tqdm>=4.68.3",
    "pytz>=2026.2",
    # --- Testing ---
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
